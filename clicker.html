<!DOCTYPE html>
<html lang="lv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Doge Clicker</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    transition: 0.5s;
    background-size: cover;
    background-position: center;
}

.bg1 {
    background: linear-gradient(135deg, #ffecd2, #fcb69f);
}

.bg2 {
    background-image: url("https://wallpapercave.com/wp/wp6975998.jpg");
}

.bg3 {
    background-image: url("https://wallpapercave.com/wp/wp11369181.jpg");
}

.game {
    background: rgba(255,255,255,0.9);
    padding: 30px;
    border-radius: 20px;
    text-align: center;
    width: 420px;
}

#score {
    font-size: 40px;
    font-weight: bold;
    color: orange;
    margin: 20px 0;
}

#doge {
    width: 250px;
    cursor: pointer;
    border-radius: 20px;
}

button {
    margin: 8px;
    padding: 12px;
    border: none;
    border-radius: 10px;
    background: #ff6600;
    color: white;
    cursor: pointer;
}

#infoBox {
    margin-top: 20px;
    padding: 15px;
    border-radius: 10px;
    background: #ffe0cc;
    display: none;
}
</style>
</head>

<body class="bg1">

<div class="game">
    <h1>Doge Clicker</h1>

    <div id="score">0</div>

    <img id="doge" src="https://pngimg.com/uploads/doge_meme/doge_meme_PNG8.png">

    <br>

    <button onclick="buySkin()">Pirkt skinu</button>
    <button onclick="upgradeClicks()">Uzlabot klikšķus</button>
    <button onclick="changeBackground()">Mainīt fonu</button>
    <button onclick="showInfo()">Informācija</button>

    <div id="infoBox"></div>
</div>

<script src="clicker.js"></script>

</body>
</html>
